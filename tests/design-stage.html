<!doctype html>
<html data-liquid-design-stage><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flexible UI · デザイン試作</title>
<link rel="stylesheet" href="/design-native/captured.css">
<link rel="stylesheet" href="/ambient.css">
<link rel="stylesheet" href="/design-stage.css">
<link rel="stylesheet" href="/watch-sidebar.css">
<link rel="stylesheet" href="/settings-designs.css">
</head>
<!-- NATIVE_YOUTUBE_BODY -->
  <aside id="stage-panel" hidden></aside>
  <dialog id="design-settings" aria-labelledby="design-title" data-theme="dark">
    <header class="settings-header"><span class="settings-brand">Flexible UI</span><span class="settings-caption">設定</span><button class="icon-button" id="stage-close" type="button" aria-label="設定を閉じる"><span data-icon="x"></span></button></header>
    <div class="settings-layout">
      <nav class="site-nav" id="site-nav" aria-label="編集する設定"></nav>
      <main class="settings-content" id="settings-content">
        <div class="view-heading"><h2 id="design-title" tabindex="-1">外観</h2></div>
        <div id="design-view"></div>
      </main>
    </div>
    <footer class="settings-footer"><span>デザイン試作 · この画面だけに反映</span><div class="video-picker"><span id="video-name" role="status"></span><label class="video-file-label">動画を選ぶ<input id="stage-file" type="file" accept="video/*,.mkv,.mov,.m4v" aria-label="ローカルの動画を選ぶ"></label></div></footer>
    <aside id="design-help" class="help-popover" popover="auto" aria-labelledby="help-title"><div class="help-heading"><strong id="help-title"></strong><button class="icon-button" id="help-close" type="button" aria-label="説明を閉じる"><span data-icon="x"></span></button></div><p id="help-text"></p></aside>
  </dialog>
  <script src="/settings-store.js"></script>
  <script src="/lucide-icons.js"></script>
  <script src="/design-icons.js"></script>
  <script src="/site-registry.js"></script>
  <script src="/playback-card.js"></script><script src="/choice-menu.js"></script><script src="/color-picker.js"></script><script src="/quick-panel.js"></script>
  <script src="/watch-sidebar.js"></script><script src="/channel-bridge.js"></script><script src="/channel-card.js"></script>
  <script src="/design-settings-bridge.js"></script><script src="/settings-backup.js"></script><script src="/settings-dialog.js"></script>
  <script src="/settings-designs.js"></script>
  <script src="/design-stage.js"></script>

</html>
