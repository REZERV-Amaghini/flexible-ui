<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>表示確認用の試作チャット</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; color: #eee; background: #101015e8; font: 13px/1.5 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { flex: none; padding: 16px; border-bottom: 1px solid #ffffff12; font-size: 14px; font-weight: 600; }
    main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 8px 0; }
    article { display: flex; gap: 10px; padding: 9px 16px; }
    article:hover { background: #ffffff06; }
    .avatar { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--avatar); color: #fff; font-size: 11px; }
    .message { min-width: 0; }
    .name { text-decoration: none; cursor: pointer; margin-right: 8px; color: #9a9aab; font-size: 12px; font-weight: 600; }
    footer { flex: none; padding: 12px 16px; color: #92929e; border-top: 1px solid #ffffff12; font-size: 12px; }
  </style>
</head>
<body>
  <header>チャットのリプレイ</header>
  <main aria-label="試作チャットのメッセージ"></main>
  <footer>表示確認用のメッセージです</footer>
  <script>
    const names = ['viewer A', 'viewer B', 'viewer C', 'viewer D'];
    const colors = ['#68819c', '#956588', '#668774', '#967e55'];
    const messages = ['この曲が好きです', 'ここから雰囲気が変わるね', '音がよく聞こえる', '次の曲も楽しみ'];
    const list = document.querySelector('main');
    for (let index = 0; index < 60; index++) {
      const member = index % names.length, row = document.createElement('article');row.setAttribute('data-channel-demo', 'https://www.youtube.com/@viewer-' + member);
      const avatar = document.createElement('span');avatar.className = 'avatar';avatar.textContent = String.fromCharCode(65 + member);
      avatar.style.setProperty('--avatar', colors[member]);avatar.setAttribute('aria-hidden', 'true');
      const message = document.createElement('div');message.className = 'message';
      const name = document.createElement('a');name.className = 'name';name.href = 'https://www.youtube.com/@viewer-' + member;name.textContent = '@viewer-' + member;
      message.append(name, messages[(index + Math.floor(index / 4)) % messages.length]);
      row.append(avatar, message);list.append(row);
    }
  </script>
</body>
</html>
