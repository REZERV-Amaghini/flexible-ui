const nativeChecks=document.createElement('button');nativeChecks.id='fixture-check-native-menu';nativeChecks.textContent='Check native chat menu palette';

  const dark=parent.document.documentElement.hasAttribute('dark'),chatDark=document.documentElement.hasAttribute('dark'),fansHidden=fans.hidden,focused=document.activeElement;
  const headerButton=document.querySelector('#live-chat-header-context-menu button'),login=document.querySelector('#fixture-chat-login'),up=document.querySelector('#fixture-fans-up'),badge=document.querySelector('#fixture-rank-badge'),upIcon=up.querySelector('svg');
  const late=login.cloneNode(true);late.id='fixture-chat-late-control';login.after(late);
  const failures=[],cases=[];let assertions=0,geometry=null;
  const check=(value,message)=>{assertions++;if(!value)failures.push(message);};
  const update=(key,value)=>{const field=fields[key];if(key==='enabled')field.checked=value;else field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));};
  const waitPaint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const alpha=value=>Number(value.match(/[\d.]+/g)?.[3]??1),paint=n=>getComputedStyle(n).backgroundColor;
  const filterLevel=n=>{const value=getComputedStyle(n).filter;return value==='none'?1:Number(value.match(/opacity\(([^)]+)\)/)?.[1]);};
  try{
    update('enabled',true);fans.hidden=false;
    for(const themeDark of [true,false]){
      parent.document.documentElement.toggleAttribute('dark',themeDark);document.documentElement.toggleAttribute('dark',themeDark);
      for(const values of [{master:1,controls:100,reading:100,navigation:100},{master:.5,controls:60,reading:80,navigation:40},{master:1,controls:0,reading:100,navigation:100},{master:1,controls:100,reading:0,navigation:100},{master:1,controls:100,reading:100,navigation:0},{master:0,controls:100,reading:100,navigation:100}]){
        update('surfaceMultiplier',values.master);update('controlDensity',values.controls);update('readingDensity',values.reading);update('navigationDensity',values.navigation);await waitPaint();
        const controls=values.master*values.controls/100,navigation=values.master*values.navigation/100,reading=values.master*values.reading/100,name=(themeDark?'dark':'light')+' '+JSON.stringify(values);
        const headerStyle=getComputedStyle(headerButton),loginStyle=getComputedStyle(login),upStyle=getComputedStyle(up),rect=up.getBoundingClientRect();
        if(!geometry)geometry={width:rect.width,height:rect.height};
        check(Math.abs(alpha(headerStyle.backgroundColor)-.22*controls)<.002,name+': header control paint');
        check(Math.abs(alpha(loginStyle.backgroundColor)-.22*controls)<.002,name+': neutral filled paint');
        check(headerStyle.backdropFilter.includes('blur('+Number((12*controls).toFixed(6))+'px)'),name+': independent control blur');
        check(getComputedStyle(document.querySelector('yt-live-chat-header-renderer')).backdropFilter==='blur('+Number((12*reading).toFixed(6))+'px)',name+': independent reading blur');
        check(alpha(upStyle.backgroundColor)===0&&upStyle.backdropFilter==='none',name+': menu control avoids an extra face and blur');
        check(Math.abs(filterLevel(headerButton.querySelector('.ytSpecTouchFeedbackShapeFill'))-controls)<.000001,name+': header feedback multiplier');
        check(Math.abs(filterLevel(login.querySelector('.ytSpecTouchFeedbackShapeFill'))-controls)<.000001,name+': alpha feedback multiplier');
        check(Math.abs(filterLevel(up.querySelector('.ytSpecTouchFeedbackShapeFill'))-navigation)<.000001,name+': menu feedback multiplier');
        check(getComputedStyle(headerButton.querySelector('.ytSpecTouchFeedbackShapeFill')).opacity==='0.35'&&getComputedStyle(login.querySelector('.ytSpecTouchFeedbackShapeFill')).opacity==='0.55',name+': native fade opacity retained');
        check(loginStyle.color===(themeDark?'rgb(238, 238, 238)':'rgb(15, 15, 15)')&&upStyle.color===loginStyle.color,name+': neutral foreground follows page theme');
        check(up.querySelector('svg')===upIcon&&getComputedStyle(upIcon).fill===upStyle.color,name+': original icon and currentColor retained');
        check(paint(badge)==='rgb(221, 152, 255)'&&getComputedStyle(badge).color==='rgb(0, 0, 0)'&&badge.disabled,name+': semantic rank badge retained');
        check(getComputedStyle(late).backgroundColor===loginStyle.backgroundColor&&getComputedStyle(late).backdropFilter===loginStyle.backdropFilter,name+': late neutral control uses the same CSS');
        check(Math.abs(rect.width-geometry.width)<.001&&Math.abs(rect.height-geometry.height)<.001,name+': native control dimensions retained');
        cases.push({theme:themeDark?'dark':'light',values,headerPaint:headerStyle.backgroundColor,controlBlur:headerStyle.backdropFilter,menuPaint:upStyle.backgroundColor,menuBlur:upStyle.backdropFilter});
      }
      update('enabled',false);await waitPaint();
      check(paint(login)===(themeDark?'rgb(241, 241, 241)':'rgb(15, 15, 15)'),(themeDark?'dark':'light')+': OFF restores native filled background');
      check(getComputedStyle(login).color===(themeDark?'rgb(15, 15, 15)':'rgb(241, 241, 241)'),(themeDark?'dark':'light')+': OFF restores native filled foreground');
      check(getComputedStyle(login).backdropFilter==='none'&&getComputedStyle(login.querySelector('.ytSpecTouchFeedbackShapeFill')).filter==='none',(themeDark?'dark':'light')+': OFF restores native effects');
      check(paint(badge)==='rgb(221, 152, 255)'&&badge.disabled,(themeDark?'dark':'light')+': OFF preserves semantic badge');
      update('enabled',true);
    }
  }catch(error){failures.push(error.message);}finally{
    parent.document.documentElement.toggleAttribute('dark',dark);document.documentElement.toggleAttribute('dark',chatDark);
    for(const [key,value] of Object.entries(saved))update(key,value);await waitPaint();fans.hidden=fansHidden;late.remove();focused?.focus?.({preventScroll:true});
  }
  controlResult.textContent=failures.length?'FAIL: '+failures.join('; '):'PASS: '+assertions+' chat control checks across independent roles, zero shade, native fade/state, late controls and OFF restoration';
  controlResult.dataset.status=failures.length?'fail':'pass';controlResult.dataset.results=JSON.stringify({assertions,failures,cases});
};
